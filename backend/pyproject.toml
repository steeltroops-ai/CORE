[tool.poetry]
name = "core-backend"
version = "0.1.0"
description = "CORE backend service for commercialization insights"
authors = ["CORE Team <team@example.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
requests = "^2.31.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
pydantic = "^1.10.0"
python-dotenv = "^1.0.0"
redis = "^5.0.0"
anthropic = "^0.34.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
httpx = "^0.27.0"
ruff = "^0.5.0"
black = "^24.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
